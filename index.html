<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTARVAA | Haute Horlogerie</title>
  <meta name="description" content="ASTARVAA — Indian Ideas, Timeless Stories. Coming Soon.">
  
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Apple San Francisco & DM Sans Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..700;1,9..40,100..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <meta name="author" content="Curious Kaizer">
  <meta name="developer" content="Curious Kaizer - https://www.curiouskaizer.com/">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ASTARVAA",
    "description": "ASTARVAA — Indian Ideas, Timeless Stories. Haute Horlogerie.",
    "creator": {
      "@type": "Organization",
      "name": "Curious Kaizer",
      "url": "https://www.curiouskaizer.com/",
      "sameAs": [
        "https://www.instagram.com/curiouskaizer",
        "https://www.linkedin.com/company/curiouskaizer"
      ]
    }
  }
  </script>
</head>
<body>

  <!-- Minimalist Apple-Style Fixed Navigation -->
  <header class="global-nav">
    <div class="nav-brand">
      <a href="#world1" class="brand-link" id="brandHomeLink">ASTARVAA</a>
    </div>
  </header>

  <!-- Universal Sound Control -->
  <div class="sound-control-wrapper">
    <button id="soundToggle" class="sound-toggle" aria-label="Toggle Sound" title="Sound Experience">
      <span class="sound-icon-wrapper">
        <svg class="sound-icon sound-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
        <svg class="sound-icon sound-active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </span>
      <span class="sound-text" id="soundText">SOUND OFF</span>
    </button>
  </div>

  <!-- Main Viewport Deck Stage (Hero Section) -->
  <main class="story-viewport" id="storyViewport">

    <!-- ======================================================================
         WORLD 1: THE CALIBER (Hero - Purely "COMING SOON")
         ====================================================================== -->
    <section class="world-slide active" id="world1" data-index="1">
      <div class="video-container">
        <video
          id="videoCaliber"
          class="hero-video"
          autoplay
          loop
          muted
          playsinline
          preload="auto"
        >
          <source src="assets/astarvaa-hero.mp4" type="video/mp4">
        </video>
        <div class="video-overlay" aria-hidden="true"></div>
      </div>

      <!-- Pure Minimalist Hero Announcement -->
      <div class="hero-center-wrapper">
        <h1 class="coming-soon-title">COMING SOON</h1>
      </div>
    </section>

    <!-- ======================================================================
         OTHER WORLDS (Temporarily removed per user request)
         ======================================================================
    <section class="world-slide" id="world2" data-index="2">
      <div class="video-container">
        <video id="videoSanctum" class="hero-video" muted playsinline preload="auto">
          <source src="assets/astarvaa-temple.mp4" type="video/mp4">
        </video>
        <div class="video-overlay video-overlay-temple" aria-hidden="true"></div>
      </div>
      <div class="world-subtle-indicator">
        <span class="subtle-code">II</span>
        <span class="subtle-dot"></span>
        <span class="subtle-name">SACRED SANCTUM</span>
      </div>
    </section>

    <section class="world-slide" id="world3" data-index="3">
      <div class="video-container">
        <video id="videoAtelier" class="hero-video" muted playsinline preload="auto">
          <source src="assets/astarvaa-atelier.mp4" type="video/mp4">
        </video>
        <div class="video-overlay video-overlay-atelier" aria-hidden="true"></div>
      </div>
      <div class="blueprint-specs-container">
        <div class="specs-grid">
          <div class="spec-item">
            <span class="spec-value">44.2<span class="spec-unit">mm</span></span>
            <span class="spec-label">Case Diameter</span>
          </div>
          <div class="spec-item">
            <span class="spec-value">9.8<span class="spec-unit">mm</span></span>
            <span class="spec-label">Cameo Relief</span>
          </div>
          <div class="spec-item">
            <span class="spec-value">1.135<span class="spec-unit">mm</span></span>
            <span class="spec-label">Tolerance</span>
          </div>
          <div class="spec-item">
            <span class="spec-value">2.1<span class="spec-unit">mm</span></span>
            <span class="spec-label">Subdial Gauge</span>
          </div>
          <div class="spec-item">
            <span class="spec-value">1:10</span>
            <span class="spec-label">Drafting Scale</span>
          </div>
        </div>
        <div class="specs-footer">
          <span class="specs-provenance">BLUEPRINT ARCHIVE &bull; CROWN DETAIL &bull; ANATOMICAL RELIEF &bull; ROCK BASE DETAIL</span>
          <button class="vip-interest-btn notify-trigger" aria-label="Register Interest">
            <span>REGISTER INTEREST</span>
          </button>
        </div>
      </div>
    </section>
    -->

    <footer style="text-align: center; padding: 24px 0 16px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.35; color: #888;">
    <span>Crafted by <a href="https://www.curiouskaizer.com/" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;" title="Curious Kaizer - Luxury Web Design & Development Agency">Curious Kaizer</a></span>
  </footer>
  </main>

  <!-- VIP Register Interest Dialog -->
  <dialog class="vip-dialog" id="vipModal">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="Close dialog">&times;</button>
      <div class="modal-badge">EXCLUSIVE ALLOCATION</div>
      <h3 class="modal-title">THE SANKAT MOCHAN</h3>
      <p class="modal-desc">
        A strictly numbered haute horlogerie collection honoring timeless devotion. Register your email for private allocations and collector updates.
      </p>
      <form class="modal-form" id="vipForm">
        <div class="input-wrapper">
          <input type="email" id="vipEmail" placeholder="Enter your email" required autocomplete="email">
          <button type="submit" class="submit-btn" id="submitBtn">NOTIFY ME</button>
        </div>
        <p class="form-feedback" id="formFeedback"></p>
      </form>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
